<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Memory Game</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fonts (optional, you can remove this too for more "basic") -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>

<body class="light">

<!-- navbar -->
<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand mb-0 h1">
    Pokémon Memory Game
  </span>

  <div class="form-check form-switch text-white">
    <input class="form-check-input" type="checkbox" id="theme-checkbox">
    <label class="form-check-label">Dark Mode</label>
  </div>
</nav>

<!-- Controls -->
<div class="container my-3">

  <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center">

    <!-- Difficulty -->
    <div>
      <label class="form-label">Difficulty</label>
      <div class="btn-group">
        <button class="btn btn-outline-primary diff-btn active" data-diff="easy">Easy</button>
        <button class="btn btn-outline-primary diff-btn" data-diff="medium">Medium</button>
        <button class="btn btn-outline-primary diff-btn" data-diff="hard">Hard</button>
      </div>
    </div>

    <!-- Actions -->
    <div class="btn-group">
      <button id="start-btn" class="btn btn-success">Start</button>
      <button id="reset-btn" class="btn btn-danger">Reset</button>
      <button id="powerup-btn" class="btn btn-warning">Peek</button>
    </div>

  </div>
</div>

<!-- Stats -->
<div class="container">
  <div class="row text-center g-2">

    <div class="col-6 col-md">
      <div class="card p-2">
        <small>Clicks</small>
        <h5 id="clicks">0</h5>
      </div>
    </div>

    <div class="col-6 col-md">
      <div class="card p-2">
        <small>Matched</small>
        <h5 id="pairs-matched">0</h5>
      </div>
    </div>

    <div class="col-6 col-md">
      <div class="card p-2">
        <small>Left</small>
        <h5 id="pairs-left">0</h5>
      </div>
    </div>

    <div class="col-6 col-md">
      <div class="card p-2">
        <small>Total</small>
        <h5 id="total-pairs">0</h5>
      </div>
    </div>

    <div class="col-12 col-md">
      <div class="card p-2">
        <small>Time</small>
        <h5 id="timer">--</h5>
      </div>
    </div>

  </div>
</div>

<!-- load -->
<div id="loading" class="text-center my-3 d-none">
  <div class="spinner-border text-primary"></div>
  <p>Fetching Pokémon...</p>
</div>

<div class="container my-3">
  <div id="game_grid" class="row g-2 justify-content-center"></div>
</div>

<!-- message modal -->
<div class="modal fade" id="messageModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center">

      <div class="modal-header">
        <h5 class="modal-title" id="message-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div id="message-body"></div>
      </div>

      <div class="modal-footer justify-content-center">
        <button id="message-play-again" class="btn btn-primary">
          Play Again
        </button>
      </div>

    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="text-center py-3 light">
  <small>
    COMP 2537 Assignment 3
  </small>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="index.js"></script>
</body>
</html>
